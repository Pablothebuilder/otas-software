services:
  dev-environment:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/pablothebuilder/dev-environment:latest
    container_name: otas_dev_container
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
