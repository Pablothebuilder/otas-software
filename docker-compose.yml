services:
  dev-environment:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/pablothebuilder/dev-environment:latest
    container_name: otas_dev_container
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
      QT_X11_NO_MITSHM: "1"
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg:rw
    stdin_open: true
    tty: true
